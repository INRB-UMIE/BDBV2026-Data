source: "INRB/INOHA BDBV 2026 genomic surveillance (whole-genome sequencing consensus metadata)"
citation: "Institut National de Recherche Biomédicale (INRB) / One Health Institute for Africa (INOHA), Kinshasa. Bundibugyo ebolavirus (BDBV) 2026 genomic surveillance. Consensus sequence metadata reconciled from FASTA headers, laboratory linelists (Bunia, Kinshasa) and the DHIS2 alert linelist (BDBV2026-Phylogenetic-analyses). Health-zone geometry: DRC_Health_zones.shp (see data/shapefiles/)."
