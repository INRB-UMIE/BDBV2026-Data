notes: |
  Annex A (PDF pages 8–11): proportion of Vodacom subscribers seen in Bunia, Mongbwalu,
  or Rwampara during 3–23 April who were later observed in each destination health zone
  at D+7, D+14, D+21, D+28, D+31 (30 Apr, 7 May, 14 May, 21 May, 24 May 2026).

  HDX cohort extracts (8 Jun 2026 release):
    - Ituri cohort (Bunia, Mongbwalu, Nyankunde, Rwampara origins): average subscriber
      presence days by destination for a 21-day look-back (12 Apr–3 May) and 21-day
      follow-up (18 May–8 Jun).
    - Nord-Kivu cohort (Beni, Butembo, Katwa origins): same layout.

  Pipeline:
    1. extract_pdf_annex.py → raw/short_trips_destination_rankings.csv
    2. process.py → annex proportion snapshots + cohort subscriber-day snapshots
       (matrices and matching long vectors)

  Processed matrices use canonical destination `nom` column headers. Origin rows repeat
  the cohort-level destination profile per snapshot. Long vectors melt each matrix for
  GeoJSON embedding. Zone labels follow data/flowminder/process.py resolution rules.
