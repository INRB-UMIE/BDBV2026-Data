notes: |
  Raw pairwise OD table: raw/hdx_flowminder_relocations_march2026.csv (HDX, March 2026 release).
  process.py builds one static matrix from est_flows_2026_04 (relocations 2026-03 to 2026-04).
  Zone names are stripped of HDX prefixes/suffixes and mapped to canonical DRC_Health_zones Nom.
  Redacted cells (<15 persons) are treated as missing. Legacy PDF-extracted inflow/outflow
  matrices in raw/ are superseded by this HDX export.
