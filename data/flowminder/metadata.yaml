notes: |
  Two generation sources ship side by side:

  March 2026 (provincial PDF extracts; original process workflow in README.md):
    processed/flowminder__inflow__static.matrix.csv
    processed/flowminder__outflow__static.matrix.csv
    Raw: raw/mobilite_od_matrix_{inflow,outflow}_mar2026_flowminder.csv

  April 2026 (national HDX long OD table; process.py):
    raw/drc-estimated-relocations-2020_03-2026_04-v2.0-external.csv
    raw/drc-estimated-relocations-2020_03-2026_04-v2.0-variable-list.csv
    processed/flowminder__inflow_202604__static.matrix.csv
    processed/flowminder__outflow_202604__static.matrix.csv
    Built from est_flows_2026_04 only (*_LB / *_UB omitted). Redacted cells
    ("redacted (count <15)") are empty. Labels strip "{prov_code} … Zone de
    Santé" and map to data/shapefiles/DRC_Health_zones.shp Nom values.

  tools.build_geojson stages all QA-passing matrices under build/matrix/.
